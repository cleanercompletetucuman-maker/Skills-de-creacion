    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#s1-cam", { scale: 1 }, { scale: 1.08, duration: 3, ease: "none", transformOrigin: "50% 45%" }, 0);
    // Gatillo apretado desde el frame 0
    tl.fromTo("#s1-trigger", { rotation: 0 }, { rotation: -10, svgOrigin: "180 175", duration: 0.12, yoyo: true, repeat: 7, ease: "power1.inOut" }, 0);
    tl.fromTo("#s1-bottle", { rotation: -4 }, { rotation: 3, duration: 0.5, yoyo: true, repeat: 5, ease: "sine.inOut", transformOrigin: "60% 90%" }, 0);
    // Nube de spray: ya en el aire en el frame 0
    const drops = gsap.utils.toArray("#s1-mist .s1-d");
    drops.forEach((d, i) => {
      const ang = (-0.55 + (i % 8) * 0.14) + Math.floor(i / 8) * 0.03;
      const dist = 300 + (i % 5) * 65 + Math.floor(i / 8) * 40;
      const tx = -Math.cos(ang) * dist;
      const ty = Math.sin(ang) * dist + 60;
      const pre = 0.25 + (i % 6) * 0.08;
      tl.fromTo(d, { x: tx * pre, y: ty * pre, opacity: 0.95 }, { x: tx, y: ty, opacity: 0.7, duration: 1.4 + (i % 3) * 0.2, ease: "power2.out" }, 0);
    });
    // El spray "ensucia": la nube se vuelve roja
    tl.to(drops, { attr: { fill: "#ff3b47" }, duration: 0.25, stagger: 0.01 }, 1.1);
    tl.to(drops, { scale: 1.6, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(2)", stagger: 0.008 }, 1.1);
    // Texto palabra por palabra, en sincronía con la voz

    });
